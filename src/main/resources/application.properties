spring.application.name=matriz

# Configuration comes from environment variables. For local use they can be put in a
# .env file at the project root (never committed; see .env.example and .gitignore).
spring.config.import=optional:file:.env[.properties]

# Database connection (CMP-12 Data Storage). No defaults: a missing variable stops startup.
spring.datasource.url=${MATRIZ_DB_URL}
spring.datasource.username=${MATRIZ_DB_USER}
spring.datasource.password=${MATRIZ_DB_PASSWORD}

# Schema is created and changed only by Flyway migrations in db/migration.
spring.flyway.locations=classpath:db/migration
# Never wipe the database from the application.
spring.flyway.clean-disabled=true

server.port=${MATRIZ_PORT:8080}

# Data access: the schema is owned by Flyway, so Hibernate never changes it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Requests with fields the API does not define are refused (openapi.yaml: additionalProperties false).
spring.jackson.deserialization.fail-on-unknown-properties=true
# JSON field names use snake_case, as in openapi.yaml (for example owner_member_id).
spring.jackson.property-naming-strategy=SNAKE_CASE

# Sign-in sessions (TD-03, decided 2026-11-12): server-side, in memory, expire after this idle time.
server.servlet.session.timeout=${MATRIZ_SESSION_TIMEOUT:8h}
server.servlet.session.cookie.name=MATRIZ_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set to true when Matriz is served over HTTPS; local use is plain HTTP.
server.servlet.session.cookie.secure=${MATRIZ_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie

# Base URL of the API for the user interface, served as /config.js (CMP-11). Empty: this server. A path such as /api
# works behind a proxy on the same site; another site does not, because the cookies are same-site only (TD-03).
matriz.api-base-url=${MATRIZ_API_BASE_URL:}

# Abuse protection for sign-up and sign-in (NFR-11, SP-08; decided 2026-11-18). Counters are in memory per client
# address, so they restart with the application. How the client address is read behind a proxy is pending (TD-13):
# until then the address of the direct connection is used.
matriz.rate-limit.sign-up.max=${MATRIZ_RATE_SIGN_UP_MAX:5}
matriz.rate-limit.sign-up.window=${MATRIZ_RATE_SIGN_UP_WINDOW:1h}
matriz.rate-limit.sign-in.max-per-ip-and-email=${MATRIZ_RATE_SIGN_IN_MAX_PER_IP_AND_EMAIL:10}
matriz.rate-limit.sign-in.max-per-ip=${MATRIZ_RATE_SIGN_IN_MAX_PER_IP:50}
matriz.rate-limit.sign-in.window=${MATRIZ_RATE_SIGN_IN_WINDOW:15m}

# Forwarded headers (X-Forwarded-For and similar) are NOT trusted until TD-13 is decided. Set explicitly so that a hosting
# platform cannot switch the trust on by itself (security audit S-10, approved 2026-11-18).
server.forward-headers-strategy=none
