spring.application.name=matriz

# Configuration comes from environment variables. For local use they can be put in a
# .env file at the project root (never committed; see .env.example and .gitignore).
spring.config.import=optional:file:.env[.properties]

# Database connection (CMP-12 Data Storage). No defaults: a missing variable stops startup.
spring.datasource.url=${MATRIZ_DB_URL}
spring.datasource.username=${MATRIZ_DB_USER}
spring.datasource.password=${MATRIZ_DB_PASSWORD}

# Schema is created and changed only by Flyway migrations in db/migration.
spring.flyway.locations=classpath:db/migration
# Never wipe the database from the application.
spring.flyway.clean-disabled=true

server.port=${MATRIZ_PORT:8080}
