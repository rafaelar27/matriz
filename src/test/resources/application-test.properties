# Profile "test": automated tests that change data use a separate database, never the development one.
# Same role and password as MATRIZ_DB_USER / MATRIZ_DB_PASSWORD.
spring.datasource.url=${MATRIZ_TEST_DB_URL:jdbc:postgresql://localhost:5432/matriz_test}

# INC-12 (NFR-11): high limits so the many integration tests that share one application context and one client
# address are never refused. The rate-limit tests set small limits themselves (SignUpRateLimitTest).
matriz.rate-limit.sign-up.max=1000
matriz.rate-limit.sign-in.max-per-ip-and-email=1000
matriz.rate-limit.sign-in.max-per-ip=1000
