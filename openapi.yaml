openapi: 3.1.0

info:
  title: Matriz API
  version: 0.2.0-draft
  summary: Draft API for the Matriz MVP (authentication, task creation and task status changes).
  description: |
    Draft specification of the Matriz MVP API, a project and task management
    platform for work teams: sign-in, the signed-in profile and sign-out, and two
    task operations.

    **Status:** draft, written on 2026-11-05; authentication added on 2026-11-12
    (INC-02, docs/implementation-plan.md). The technology stack is chosen in
    docs/architecture.md (Technology stack). Authentication uses a server-side
    session cookie (TD-03, decided 2026-11-12); see `components.securitySchemes`.

    **Authentication and session lifecycle:**
    1. `GET /auth/csrf` sets the `XSRF-TOKEN` cookie.
    2. `POST /auth/sign-in` checks the email and password (stored only as a
       BCrypt hash) and creates a new server-side session, identified by the
       `MATRIZ_SESSION` cookie (HttpOnly, SameSite=Lax). A new session id is
       issued on every sign-in, and a new CSRF token with it.
    3. Every other request needs that cookie. Every request that changes data
       (POST, PATCH, PUT, DELETE) also needs the header `X-XSRF-TOKEN` with the
       value of the `XSRF-TOKEN` cookie; without it the response is 403
       `csrf_invalid`.
    4. The session expires after 8 hours without requests (configurable). It
       also ends at `POST /auth/sign-out` and when the application restarts
       (sessions are kept in memory).
    5. A request with an ended or expired session gets 401 `session_expired`; a
       request without a session gets 401 `not_authenticated`.

    **Identity:** the caller is always the signed-in account. Fields that would
    set identity, such as `created_by_member_id`, are refused (422). Membership,
    role and status are read on every request, so deactivation and role changes
    apply immediately (SP-03, SP-04).

    **403 or 404:** a project or task in a workspace the caller does not belong
    to returns 404, as if it did not exist (API-A3). Inside the caller's own
    workspace, an action the caller may not perform returns 403.

    **Provisional rules** (most restrictive reading of pending decisions, approved
    by the project decision-maker on 2026-11-12, to be revisited when decided):
    Workspace Administrators cannot create tasks (PD-03); Team Members can only
    create tasks they own (PD-01); only a task's owner changes its status, also
    for Project Managers (PD-01); Viewers are refused even on tasks they own
    (PD-17); only project members can create tasks in a project (PD-20).

    **Sources of truth:** docs/requirements.md (FR, NFR), docs/user-stories.md
    (US, AC, EC), docs/constraints.md (AQ, SP, TD, PD), docs/architecture.md
    (CMP) and docs/database.md (entities, BR, DA). Attribute names, types and
    required fields follow the Task entity in docs/database.md.

    **Operations:**
    - `getCsrfToken`, `signIn`, `getCurrentProfile`, `signOut` support FR-01
      and US-01 (SP-01). Owning component: CMP-01 Accounts and Sign-in.
    - `createTask` supports US-10 (FR-09, FR-10, FR-11, FR-12). Owning component: CMP-05 Tasks.
    - `updateTaskStatus` supports US-11 (FR-12). Owning component: CMP-05 Tasks.

    **Assumptions made in this specification** (not confirmed requirements):
    - **API-A1.** *Withdrawn 2026-11-12:* replaced by the session cookie
      (TD-03).
    - **API-A2.** A body that cannot be parsed returns 400. A well-formed body
      that breaks a business or validation rule returns 422.
    - **API-A3.** A project or task in another workspace returns 404, exactly as
      if it did not exist, so that its existence is not revealed (NFR-01, SP-02).
    - **API-A4.** Identifiers are opaque strings; their format is not decided.
    - **API-A5.** A task's description and due date are optional (DA-04, pending PD-04).

    **Pending decisions that this specification deliberately leaves open:**
    - **PD-01:** whether a Team Member may create a task owned by someone else,
      and whether non-owners may change a task's status.
    - **PD-20:** whether a member must belong to the project to create a task
      in it (not stated by FR-09 or FR-07).
    - **PD-21:** whether a title of spaces only is rejected (FR-09, BR-10
      only say the title is required). This draft rejects only an empty title.
    - **PD-04:** maximum title length; whether description and due date are required.
    - **PD-05:** whether tasks can be created or changed in an archived project.
    - **PD-06:** whether a Done task may move back to an earlier status.
    - **PD-11 / TD-07:** which change wins when two people change the same task (EC-07).
    - **PD-12:** whether members are notified of their own actions.
    - **PD-16:** whether one account can be a member of several workspaces. The
      paths avoid a workspace identifier: the workspace is the one the project
      or task belongs to.
    - **PD-17:** whether a Viewer who owns a task can change its status.

servers:
  - url: http://localhost:8080
    description: Local development (README, Getting started). No hosting has been chosen (TD-02).

security:
  - sessionCookie: []

tags:
  - name: Authentication
    description: |
      Sign-in, the signed-in profile and sign-out with a server-side session
      (FR-01, SP-01, TD-03). Owning component: CMP-01 Accounts and Sign-in.
  - name: Tasks
    description: |
      Tasks within projects: one action with exactly one owner, an optional due
      date and one of three statuses (FR-09 to FR-12). Owning component: CMP-05 Tasks.

paths:
  /auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Get a CSRF token cookie
      description: |
        Sets the `XSRF-TOKEN` cookie. Call it before the first request that
        changes data, normally `signIn`. Open to everyone.
      security: []
      responses:
        '204':
          description: The `XSRF-TOKEN` cookie is set.
          headers:
            Set-Cookie:
              description: '`XSRF-TOKEN=<token>; Path=/; SameSite=Lax` (readable by the front end).'
              schema:
                type: string

  /auth/sign-in:
    post:
      tags: [Authentication]
      operationId: signIn
      summary: Sign in with email and password
      description: |
        Checks the email and password and starts a new session (FR-01, SP-01).
        Open to everyone, but needs the `X-XSRF-TOKEN` header (see `getCsrfToken`).
        A wrong password, an unknown email and empty fields all get the same
        401 response, which does not say which field was wrong. Passwords are
        stored only as BCrypt hashes and never appear in responses or logs.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
            examples:
              ben:
                summary: Demo account (fictitious)
                value:
                  email: ben@example.com
                  password: your-demo-password
      responses:
        '200':
          description: |
            Signed in. A new `MATRIZ_SESSION` cookie and a new `XSRF-TOKEN`
            cookie are set; any earlier session of this browser is ended.
          headers:
            Set-Cookie:
              description: '`MATRIZ_SESSION=<id>; Path=/; HttpOnly; SameSite=Lax` and a new `XSRF-TOKEN`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The email or password is incorrect. Same response for every reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: invalid_credentials
                    message: The email or password is incorrect.
        '403':
          $ref: '#/components/responses/CsrfInvalid'

  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentProfile
      summary: Get the signed-in person's profile
      description: |
        Returns the signed-in account and its active workspace memberships with
        their roles (FR-01, FR-04). Deactivated memberships are not listed (SP-04).
      responses:
        '200':
          description: The signed-in profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/sign-out:
    post:
      tags: [Authentication]
      operationId: signOut
      summary: Sign out
      description: |
        Ends the session on the server and clears the `MATRIZ_SESSION` and
        `XSRF-TOKEN` cookies. Any later request with the old session cookie gets
        401 `session_expired`.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfInvalid'

  /projects/{project_id}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task in a project
      description: |
        Creates a task in the given project with a title, an optional description,
        exactly one owner and an optional due date (US-10; FR-09, FR-10, FR-11, FR-12).

        **Who can perform it:** an active member of the project's workspace whose
        role is Project Manager or Team Member (FR-09, BR-12). Viewers and
        deactivated members are refused (FR-05, AC-19.2, SP-04).

        **Set by the server, not by the client:**
        - `status` is always `To do` (FR-12, BR-11, AC-10.1).
        - `created_by_member_id` is the signed-in member; it decides who may
          later delete the task (FR-09, BR-12).

        **Rules checked:**
        - `title` is required and not empty (BR-10, AC-10.2). Whether a title of
          spaces only is refused is not decided (see info).
        - `owner_member_id` must be a member of this project (FR-10, BR-09, AC-10.3).
          A Viewer who is a project member may be the owner (FR-10).
        - All referenced records belong to the project's workspace (NFR-01, BR-18).

        **Side effect:** a "task assigned" notification is created for the owner
        (FR-17, BR-14, US-16). Whether it is created when members assign a task
        to themselves is pending PD-12.

        **Provisional rules until decided (403):** Workspace Administrators are
        refused (PD-03); a Team Member may only set themselves as the owner
        (PD-01); the caller must be a member of the project (PD-20).

        **Pending:** behaviour in an archived project (PD-05).

        **Not yet implemented (INC-02):** the "task assigned" notification side
        effect, which belongs to the notifications increment (CMP-08, FR-17).
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
            examples:
              createTaskForAna:
                summary: Task with an owner and a due date (AC-10.1)
                value:
                  title: Draft homepage text
                  description: First draft of the homepage copy for review.
                  owner_member_id: mem_ana
                  due_date: '2026-11-06'
              createTaskWithoutDueDate:
                summary: Task without a due date (EC-06, DA-04)
                value:
                  title: Collect logo files
                  owner_member_id: mem_ana
      responses:
        '201':
          description: |
            The task was created. Its status is `To do` (AC-10.1). It now appears
            in the project task list (FR-13) and in the owner's "My tasks" (FR-14).
          headers:
            Location:
              description: Path of the new task.
              schema:
                type: string
              example: /tasks/tsk_001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                createdTask:
                  summary: Created task (AC-10.1)
                  value:
                    task_id: tsk_001
                    project_id: prj_website
                    title: Draft homepage text
                    description: First draft of the homepage copy for review.
                    owner_member_id: mem_ana
                    due_date: '2026-11-06'
                    status: To do
                    created_by_member_id: mem_carla
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '422':
          description: |
            The body is well formed but breaks a validation rule. Triggers:
            - `title` is missing or empty (AC-10.2, BR-10).
            - `owner_member_id` is missing (BR-09).
            - `owner_member_id` does not refer to a member of this project,
              including a member of the workspace who is not in the project
              (AC-10.3, BR-09) or a member of another workspace (NFR-01).
            - `due_date` is not a valid calendar date.
            - An unknown field is sent, including `status` or `created_by_member_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                titleRequired:
                  summary: Empty title (AC-10.2)
                  value:
                    code: validation_failed
                    message: The task could not be created.
                    details:
                      - field: title
                        issue: A title is required.
                ownerNotProjectMember:
                  summary: Owner is not a member of the project (AC-10.3)
                  value:
                    code: validation_failed
                    message: The task could not be created.
                    details:
                      - field: owner_member_id
                        issue: The owner must be a member of this project.

  /tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    patch:
      tags: [Tasks]
      operationId: updateTaskStatus
      summary: Change a task's status
      description: |
        Changes the status of a task to `To do`, `In progress` or `Done`
        (US-11; FR-12). The new status is shown in the project task list and in
        the owner's "My tasks" (AC-11.1), and counts towards the project's
        progress (FR-18, AC-17.2).

        Only `status` can be changed through this operation in this draft. Rules
        for editing other fields, including changing the owner (AC-10.4), depend
        on PD-01 and are not specified here.

        **Who can perform it:** the task's owner, when the owner is an active
        Team Member or Project Manager (AC-11.1). Viewers are refused
        (FR-05, AC-11.3, AC-19.2), including a Viewer who owns the task, until
        PD-17 is decided. Deactivated members are refused (SP-04).

        **Provisional rule until decided (403):** members who do not own the task,
        including Project Managers, cannot change its status (PD-01).

        **Pending:** whether a Done task may move back to an earlier status
        (PD-06); which change wins when two people change the status at the same
        time (PD-11, TD-07). Whatever is decided, the task always ends up in
        exactly one of the three statuses (EC-07, BR-11).

        Sending the task's current status succeeds and leaves the task unchanged.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskStatusUpdateRequest'
            examples:
              startWork:
                summary: Move a task to In progress (AC-11.1)
                value:
                  status: In progress
              finishWork:
                summary: Mark a task as Done (AC-17.2)
                value:
                  status: Done
      responses:
        '200':
          description: The status was changed. The full task is returned (AC-11.1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                inProgressTask:
                  summary: Task after the change (AC-11.1)
                  value:
                    task_id: tsk_001
                    project_id: prj_website
                    title: Draft homepage text
                    description: First draft of the homepage copy for review.
                    owner_member_id: mem_ana
                    due_date: '2026-11-06'
                    status: In progress
                    created_by_member_id: mem_carla
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '422':
          description: |
            The body is well formed but breaks a validation rule. Triggers:
            - `status` is missing.
            - `status` is not exactly one of `To do`, `In progress`, `Done`
              (AC-11.2, BR-11).
            - A field other than `status` is sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidStatus:
                  summary: Status outside the three allowed values (AC-11.2)
                  value:
                    code: validation_failed
                    message: The status could not be changed.
                    details:
                      - field: status
                        issue: The status must be one of To do, In progress, Done.

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: MATRIZ_SESSION
      description: |
        Server-side session created by `signIn` (TD-03, decided 2026-11-12).
        The cookie is HttpOnly and SameSite=Lax (and Secure when served over
        HTTPS). The session expires after 8 hours without requests
        (`MATRIZ_SESSION_TIMEOUT`), and ends at `signOut` or when the
        application restarts. Every operation except `getCsrfToken` and `signIn`
        requires it (FR-01, SP-01). Permissions are then checked by role
        (FR-04, SP-03, CMP-03 Access Control), and deactivated members are
        refused (SP-04). Requests that change data also need `X-XSRF-TOKEN`.

  parameters:
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: |
        The value of the `XSRF-TOKEN` cookie (set by `getCsrfToken` and renewed
        by `signIn`). Required on every request that changes data; without a
        valid value the response is 403 `csrf_invalid`.
      schema:
        type: string
    ProjectId:
      name: project_id
      in: path
      required: true
      description: |
        Identifier of the project (Project.project_id). The project must belong
        to the signed-in member's workspace (NFR-01).
      schema:
        $ref: '#/components/schemas/Id'
      example: prj_website
    TaskId:
      name: task_id
      in: path
      required: true
      description: |
        Identifier of the task (Task.task_id). The task must belong to the
        signed-in member's workspace (NFR-01).
      schema:
        $ref: '#/components/schemas/Id'
      example: tsk_001

  responses:
    BadRequest:
      description: The request body is missing or cannot be parsed as JSON (assumption API-A2).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            malformedBody:
              value:
                code: malformed_request
                message: The request body could not be read.
    Unauthorized:
      description: |
        No valid session. Workspace content is only available to signed-in
        members (FR-01, SP-01). `not_authenticated`: no session cookie was
        sent. `session_expired`: the session cookie belongs to a session that
        expired, was ended by sign-out, or was lost at a restart.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notSignedIn:
              value:
                code: not_authenticated
                message: Sign in to continue.
            sessionExpired:
              value:
                code: session_expired
                message: Your session has ended. Sign in again.
    CsrfInvalid:
      description: The request changes data but has no valid `X-XSRF-TOKEN` header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            csrfInvalid:
              value:
                code: csrf_invalid
                message: The request has no valid security token. Reload the page and try again.
    Forbidden:
      description: |
        The signed-in person may not perform this action, or the request has no
        valid `X-XSRF-TOKEN` header (`csrf_invalid`). Triggers:
        - the member's role is Viewer (FR-05, AC-11.3, AC-19.2);
        - the member is deactivated (FR-03, SP-04);
        - for `updateTaskStatus`, the member is not the task's owner
          (AC-11.1; provisional for Project Managers, PD-01);
        - provisional rules for `createTask`: the member is a Workspace
          Administrator (PD-03), a Team Member setting another owner (PD-01),
          or not a member of the project (PD-20).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            viewerReadOnly:
              summary: Viewer tries to change data (AC-11.3, AC-19.2)
              value:
                code: forbidden
                message: Viewers have read-only access.
    ProjectNotFound:
      description: |
        No project with this identifier exists in the signed-in member's
        workspace. A project in another workspace gives the same response
        (NFR-01, SP-02, assumption API-A3).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            projectNotFound:
              value:
                code: not_found
                message: The project was not found.
    TaskNotFound:
      description: |
        No task with this identifier exists in the signed-in member's workspace,
        including a task that was deleted (FR-09). A task in another workspace
        gives the same response (NFR-01, SP-02, assumption API-A3).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            taskNotFound:
              value:
                code: not_found
                message: The task was not found.

  schemas:
    SignInRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          description: The account's email address (DA-01).
        password:
          type: string
          writeOnly: true
          description: Checked against the stored BCrypt hash; never stored, returned or logged.

    Profile:
      type: object
      description: The signed-in person. Never contains the password or its hash.
      required: [account_id, name, email, memberships]
      properties:
        account_id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        email:
          type: string
        memberships:
          type: array
          description: Active memberships only (SP-04).
          items:
            $ref: '#/components/schemas/Membership'
      examples:
        - account_id: a0000000-0000-0000-0000-000000000001
          name: Ana Demo
          email: ana@example.com
          memberships:
            - member_id: c0000000-0000-0000-0000-000000000002
              workspace_id: b0000000-0000-0000-0000-000000000001
              workspace_name: Acme Studio
              role: Project Manager

    Membership:
      type: object
      required: [member_id, workspace_id, workspace_name, role]
      properties:
        member_id:
          $ref: '#/components/schemas/Id'
        workspace_id:
          $ref: '#/components/schemas/Id'
        workspace_name:
          type: string
        role:
          type: string
          enum: [Workspace Administrator, Project Manager, Team Member, Viewer]

    Id:
      type: string
      minLength: 1
      description: Opaque identifier (database.md type `id`). Its format is not decided (assumption API-A4).

    TaskStatus:
      type: string
      enum: [To do, In progress, Done]
      description: A task's status; exactly one of three values (FR-12, BR-11, AC-11.2).

    TaskCreateRequest:
      type: object
      description: Fields a client may send to create a task (FR-09, FR-10, FR-11).
      required: [title, owner_member_id]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          description: |
            Required (FR-09, BR-10, AC-10.2). Maximum length pending PD-04.
            Whether a title of spaces only is refused is not decided.
          examples: [Draft homepage text]
        description:
          type: string
          description: Optional (DA-04); whether it is required is pending PD-04.
          examples: [First draft of the homepage copy for review.]
        owner_member_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: |
            The task's single owner (Member.member_id). Must be a member of the
            task's project (FR-10, BR-09, AC-10.3). Whether a Team Member may set
            someone other than themselves is pending PD-01.
          examples: [mem_ana]
        due_date:
          type: string
          format: date
          description: |
            Optional due date (FR-11; DA-04; pending PD-04). A task without a due
            date is never overdue (EC-06, BR-16).
          examples: ['2026-11-06']

    TaskStatusUpdateRequest:
      type: object
      description: The only field this operation changes (FR-12).
      required: [status]
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/TaskStatus'

    Task:
      type: object
      description: |
        A task, as defined by the Task entity in docs/database.md. Overdue state
        and project progress are derived and not part of the task (BR-15, BR-16).
      required:
        - task_id
        - project_id
        - title
        - owner_member_id
        - status
        - created_by_member_id
      properties:
        task_id:
          $ref: '#/components/schemas/Id'
        project_id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
          minLength: 1
        description:
          type: ['string', 'null']
          description: Null or absent when not given (DA-04).
        owner_member_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The task's single owner (FR-10, BR-09, AC-10.4).
        due_date:
          type: ['string', 'null']
          format: date
          description: Null or absent when the task has no due date (EC-06, DA-04).
        status:
          $ref: '#/components/schemas/TaskStatus'
        created_by_member_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The member who created the task; decides who may delete it (FR-09, BR-12).

    Error:
      type: object
      description: Shared error body for every error response.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          enum: [malformed_request, not_authenticated, forbidden, not_found, validation_failed]
        message:
          type: string
          description: Human-readable summary in the interface language (NFR-09, pending PD-13).
        details:
          type: array
          description: One entry per field that failed validation (422 only).
          items:
            type: object
            required: [field, issue]
            properties:
              field:
                type: string
                description: Name of the request field concerned.
              issue:
                type: string
                description: What is wrong with the field.
