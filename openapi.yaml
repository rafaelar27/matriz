openapi: 3.1.0

info:
  title: Matriz API
  version: 0.10.0-draft
  summary: Draft API for the Matriz MVP (authentication, workspaces, projects, progress, tasks, task assignees and comments).
  description: |
    Draft specification of the Matriz MVP API, a project and task management
    platform for work teams: sign-in, the signed-in profile and sign-out,
    projects, progress and tasks.

    **Status:** draft, written on 2026-11-05; authentication added on 2026-11-12
    (INC-02, docs/implementation-plan.md); projects on 2026-11-12 (INC-03); task
    listing, viewing, editing and deletion on 2026-11-12 (INC-04); task assignees
    and comments on 2026-11-12 (INC-05). Version 0.7.0-draft (INC-07): a
    project always has an owner, and its start date is not after its due date
    (decided 2026-11-12). Version 0.8.0-draft (2026-11-16, release review):
    documents the actual behaviour of signIn 422, undefined responses,
    nullable task fields and the Location header; no behaviour change.
    After that review (2026-11-17 and 2026-11-18, still 0.8.0-draft): the
    unscoped `updateTaskStatus` (`PATCH /tasks/{task_id}`) was removed, status
    changes use `updateTask`, `null` is refused as a status, and the
    `createTask` Location is the project-scoped path (decision log).
    The technology stack is chosen in
    docs/architecture.md (Technology stack). Authentication uses a server-side
    session cookie (TD-03, decided 2026-11-12); see `components.securitySchemes`.

    **Authentication and session lifecycle:**
    1. `GET /auth/csrf` sets the `XSRF-TOKEN` cookie.
    2. `POST /auth/sign-in` checks the email and password (stored only as a
       BCrypt hash) and creates a new server-side session, identified by the
       `MATRIZ_SESSION` cookie (HttpOnly, SameSite=Lax). A new session id is
       issued on every sign-in, and a new CSRF token with it.
    3. Every other request needs that cookie. Every request that changes data
       (POST, PATCH, DELETE) also needs the header `X-XSRF-TOKEN` with the
       value of the `XSRF-TOKEN` cookie; without it the response is 403
       `csrf_invalid`.
    4. The session expires after 8 hours without requests (configurable). It
       also ends at `POST /auth/sign-out` and when the application restarts
       (sessions are kept in memory).
    5. A request with an ended or expired session gets 401 `session_expired`; a
       request without a session gets 401 `not_authenticated`.

    **Identity:** the caller is always the signed-in account. Fields that would
    set identity, such as `created_by_member_id`, are refused (422). Membership,
    role and status are read on every request, so deactivation and role changes
    apply immediately (SP-03, SP-04).

    **403 or 404:** a project or task in a workspace the caller does not belong
    to returns 404, as if it did not exist (API-A3). Inside the caller's own
    workspace, an action the caller may not perform returns 403.

    **Provisional rules** (most restrictive reading of pending decisions, approved
    by the project decision-maker on 2026-11-12, to be revisited when decided):
    Workspace Administrators cannot create tasks (PD-03); Team Members can only
    create tasks they own (PD-01); only a task's owner changes its status, also
    for Project Managers (PD-01); Viewers are refused even on tasks they own
    (PD-17); only project members can create tasks in a project (PD-20).
    Added for INC-04 on 2026-11-12: a task's title, description and due date
    can be edited by Project Managers of the workspace and by the task's owner
    when the owner is a Team Member; only Project Managers change the owner
    (AC-10.4); Workspace Administrators can only read tasks (PD-03).

    **Outside this contract:** the user interface files (`/`, `/index.html`,
    `/css/**`, `/js/**`) and `GET /config.js`, a script generated from the
    `MATRIZ_API_BASE_URL` setting that gives the interface the API's base URL
    (approved 2026-11-12). They are served by the same application and are
    open without a session because they hold no workspace content and no
    secret (SP-01). They are not API operations and are not listed under
    `paths`.

    **Responses outside this contract:** a path or method the contract does
    not define, an unsupported `Content-Type`, and unexpected server errors
    (for example 404, 405, 415, 500) get Spring Boot's default error body
    (fields such as `timestamp`, `status`, `error`, `path`), not the `Error`
    schema (verification.md O-4). A changing request (POST, PATCH, DELETE)
    without a valid CSRF header gets 403 `csrf_invalid` before the session
    is checked; otherwise a request without a session gets 401
    `not_authenticated`. The open static paths (`/`, `/index.html`,
    `/css/**`, `/js/**`, `/config.js`) need no session.

    **Sources of truth:** docs/requirements.md (FR, NFR), docs/user-stories.md
    (US, AC, EC), docs/constraints.md (AQ, SP, TD, PD), docs/architecture.md
    (CMP) and docs/database.md (entities, BR, DA). Attribute names, types and
    required fields follow the Task entity in docs/database.md.

    **Operations:**
    - `getCsrfToken`, `signIn`, `getCurrentProfile`, `signOut` support FR-01
      and US-01 (SP-01). Owning component: CMP-01 Accounts and Sign-in.
    - `listProjects`, `createProject`, `getProject`, `updateProject` and
      `deleteProject` support US-06, US-09, US-19, US-24, US-27 and US-28
      (FR-05, FR-06, FR-08). Owning component: CMP-04 Projects. Added
      2026-11-12 (INC-03).
    - `getProjectProgress` supports US-17 (FR-18). Owning component: CMP-09 Progress Tracking.
    - `listWorkspaceMembers` lets the project form offer an owner (FR-06). Owning component: CMP-02.
    - `createTask` supports US-10 (FR-09, FR-10, FR-11, FR-12). Owning component: CMP-05 Tasks.
    - `listTasks`, `getTask`, `updateTask` and `deleteTask` support US-10,
      US-11, US-12, US-14, US-25 and US-26 (FR-09 to FR-13, FR-15). Owning
      component: CMP-05 Tasks. Added 2026-11-12 (INC-04).
    - `listEligibleAssignees`, `listTaskAssignees`, `assignTask` and
      `unassignTask` support US-29 (FR-22). Owning component: CMP-05 Tasks.
      Added 2026-11-12 (INC-05).
    - `listTaskComments` and `addTaskComment` support US-15 (FR-16). Owning
      component: CMP-07 Comments. Added 2026-11-12 (INC-05).
    - `createWorkspace` supports US-02 (FR-02, BR-01). Owning component:
      CMP-02. Added 2026-11-19 (INC-12).

    Version 0.10.0-draft (INC-13): Workspace Administrators can also create,
    edit and delete projects (`createProject`, `updateProject`,
    `deleteProject`), decided 2026-11-19 (PD-03 in part).

    **Not built in this delivery:** sign-up (FR-01, US-22); invitations and
    member management (FR-03) and role
    assignment and changes (FR-04) apart from reading active members (the
    FR-04 permissions are enforced by CMP-03); archiving projects (FR-06,
    US-07); choosing project members (FR-07, US-08) apart from the creator;
    "My tasks" (FR-14); in-app notifications (FR-17); overdue highlighting
    (FR-19); feedback (FR-20); personal-data requests (FR-21). Filtering by
    due date (FR-15) was left for later on 2026-11-12.

    **Assumptions made in this specification** (not confirmed requirements):
    - **API-A1.** *Withdrawn 2026-11-12:* replaced by the session cookie
      (TD-03).
    - **API-A2.** A body that cannot be parsed returns 400. A well-formed body
      that breaks a business or validation rule returns 422.
    - **API-A3.** *Confirmed 2026-11-17.* A project or task in another workspace returns 404, exactly as
      if it did not exist, so that its existence is not revealed (NFR-01, SP-02).
    - **API-A4.** Identifiers are opaque strings; their format is not decided.
    - **API-A5.** A task's description and due date are optional (DA-04, pending PD-04).

    **Pending decisions that this specification deliberately leaves open:**
    - **PD-01:** whether a Team Member may create a task owned by someone else,
      and whether non-owners may change a task's status.
    - **PD-20:** whether a member must belong to the project to create a task
      in it (not stated by FR-09 or FR-07).
    - **PD-04:** whether description and due date are required (both are
      optional here, DA-04). The title and description lengths were decided
      on 2026-11-12: title 3 to 150 characters after trimming, description at
      most 2000 characters. A title of spaces only is refused (PD-21, decided
      2026-11-12).
    - **PD-05:** whether tasks can be created or changed in an archived project.
    - **PD-06:** whether a Done task may move back to an earlier status.
    - **PD-11 / TD-07:** which change wins when two people change the same task (EC-07).
    - **PD-12:** whether members are notified of their own actions.
    - **PD-16:** whether one account can be a member of several workspaces,
      decided in part on 2026-11-19: `createWorkspace` is open to any
      signed-in account, also one that already belongs to other workspaces.
      Task paths avoid a workspace identifier; `listProjects` (`workspace_id`)
      and `listWorkspaceMembers` take one, and `createProject` takes
      `workspace_id` in its body. The profile lists every active
      membership.
    - **PD-17:** whether a Viewer who owns a task can change its status.

servers:
  - url: http://localhost:{port}
    description: Local development (README, Getting started). No hosting has been chosen (TD-02).
    variables:
      port:
        default: '8080'
        description: MATRIZ_PORT (server.port).

security:
  - sessionCookie: []

tags:
  - name: Authentication
    description: |
      Sign-in, the signed-in profile and sign-out with a server-side session
      (FR-01, SP-01, TD-03). Owning component: CMP-01 Accounts and Sign-in.
  - name: Projects
    description: |
      Projects of the caller's workspaces (FR-05, FR-06, FR-08). Every active
      member sees every project of their workspace; Project Managers and
      Workspace Administrators create, edit and delete them. Owning
      component: CMP-04 Projects.
  - name: Progress
    description: "Derived project progress (FR-18, BR-15). Owning component: CMP-09 Progress Tracking."
  - name: Workspaces
    description: "Creating a workspace (FR-02) and reading its members (FR-03, FR-04). Owning component: CMP-02."
  - name: Comments
    description: "Comments on tasks (FR-16). Owning component: CMP-07 Comments."
  - name: Tasks
    description: |
      Tasks within projects: one action with exactly one owner, an optional due
      date and one of three statuses (FR-09 to FR-12). Owning component: CMP-05 Tasks.

paths:
  /auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Get a CSRF token cookie
      description: |
        Sets the `XSRF-TOKEN` cookie. Call it before the first request that
        changes data, normally `signIn`. Open to everyone.
      security: []
      responses:
        '204':
          description: The `XSRF-TOKEN` cookie is set.
          headers:
            Set-Cookie:
              description: '`XSRF-TOKEN=<token>; Path=/; SameSite=Lax` (readable by the front end).'
              schema:
                type: string

  /auth/sign-in:
    post:
      tags: [Authentication]
      operationId: signIn
      summary: Sign in with email and password
      description: |
        Checks the email and password and starts a new session (FR-01, SP-01).
        Open to everyone, but needs the `X-XSRF-TOKEN` header (see `getCsrfToken`).
        A wrong password, an unknown email and empty fields all get the same
        401 response, which does not say which field was wrong. Passwords are
        stored only as BCrypt hashes and never appear in responses or logs.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
            examples:
              ben:
                summary: Demo account (fictitious)
                value:
                  email: ben@example.com
                  password: your-demo-password
      responses:
        '200':
          description: |
            Signed in. A new `MATRIZ_SESSION` cookie and a new `XSRF-TOKEN`
            cookie are set; any earlier session of this browser is ended.
          headers:
            Set-Cookie:
              description: '`MATRIZ_SESSION=<id>; Path=/; HttpOnly; SameSite=Lax` and a new `XSRF-TOKEN`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The email or password is incorrect. Same response for every reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: invalid_credentials
                    message: The email or password is incorrect.
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '422':
          description: |
            The body is well formed but has a field other than `email` and
            `password`, or a value of the wrong type (for example an object).
            `code` is `validation_failed`; `details` names the field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentProfile
      summary: Get the signed-in person's profile
      description: |
        Returns the signed-in account and its active workspace memberships with
        their roles (FR-01, FR-04). Deactivated memberships are not listed (SP-04).
      responses:
        '200':
          description: The signed-in profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/sign-out:
    post:
      tags: [Authentication]
      operationId: signOut
      summary: Sign out
      description: |
        Ends the session on the server and clears the `MATRIZ_SESSION` and
        `XSRF-TOKEN` cookies. Any later request with the old session cookie gets
        401 `session_expired`.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfInvalid'

  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List the projects the caller can see
      description: |
        Every project of every workspace where the caller is an active member,
        including projects the caller is not a member of (FR-08, AC-19.1) and
        archived projects (PD-05 pending; see `is_archived`). No operation
        archives a project in this delivery, so `is_archived` is always
        `false`. Projects of other workspaces are never listed (NFR-01).
        Sorted by name, then id.
      parameters:
        - name: q
          in: query
          required: false
          description: |
            Name search (US-28): only projects whose name contains this text,
            ignoring case. Leading and trailing spaces are ignored; empty means
            no filter.
          schema:
            type: string
            maxLength: 100
        - name: workspace_id
          in: query
          required: false
          description: |
            Only projects of this workspace. A workspace the caller is not an
            active member of gives an empty list.
          schema:
            $ref: '#/components/schemas/Id'
        - name: page
          in: query
          required: false
          description: Zero-based page number. A page whose first item would come after position 2147483647 (page times size above 2147483647) is refused with 422.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Number of projects per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: One page of projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: |
            `page` or `size` is outside its range or not a whole number,
            `q` is longer than 100 characters, or `workspace_id` is not a valid id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      description: |
        Creates a project in one of the caller's workspaces (US-06, FR-06).

        **Who can perform it:** an active Project Manager or Workspace
        Administrator of that workspace (Workspace Administrators decided
        2026-11-19, PD-03 in part, so the creator of a new workspace can add
        projects). Team Members and Viewers are refused (FR-05, FR-06).
        The same people can edit and delete projects (`updateProject`, `deleteProject`).

        **Set by the server:** `is_archived` is false, and the caller becomes
        a member of the new project (FR-07, decided 2026-11-12). The owner is
        the caller unless `owner_member_id` names another active member of
        the same workspace (FR-06, US-06). The owner is the caller when
        `owner_member_id` is not sent; it cannot be `null` (decided 2026-11-12).

        **Rules checked (422):** `name` is required and 3 to 100 characters
        after trimming spaces; `description` is at most 1000 characters
        (decided 2026-11-12); `owner_member_id` is an active member of the
        workspace; `owner_member_id`, when sent, is not `null`; dates are
        valid calendar dates; `start_date` is not after `due_date` when both
        are given (decided 2026-11-12); no other fields are sent.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
            examples:
              newProject:
                value:
                  workspace_id: b0000000-0000-0000-0000-000000000001
                  name: Customer survey
                  description: Short survey of pilot customers.
                  due_date: '2026-12-18'
      responses:
        '201':
          description: The project was created.
          headers:
            Location:
              description: Path of the new project.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The workspace does not exist or the caller is not a member of it, or `workspace_id` is not a valid id (NFR-01, API-A3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ProjectValidationFailed'

  /projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project
      description: Any active member of the project's workspace, including Viewers (FR-05, FR-08).
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Edit a project
      description: |
        Changes the sent fields (US-24, AC-24.1, FR-06). Fields not sent stay
        unchanged; `null` clears an optional field. The same rules as
        `createProject` apply; `workspace_id` and `is_archived` cannot be sent.
        `owner_member_id` cannot be `null`: a project always has an owner.
        `start_date` must not be after `due_date`; the rule is checked on the
        project as it would be after the change, so sending only one date can
        be refused.

        **Who can perform it:** any active Project Manager or Workspace
        Administrator of the project's workspace (Project Managers decided
        2026-11-12; Workspace Administrators 2026-11-19, PD-03 in part).
        Team Members and Viewers are refused.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
            examples:
              newDueDate:
                summary: Move the due date (AC-24.1)
                value:
                  due_date: '2026-12-22'
      responses:
        '200':
          description: The project after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '422':
          $ref: '#/components/responses/ProjectValidationFailed'
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete a project
      description: |
        Deletes the project together with its tasks, their comments and
        notifications, and its project members, in one transaction, so no
        dependent record remains (US-27, decided 2026-11-12). Cannot be undone.

        **Who can perform it:** the same as `updateProject`.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: The project and its dependent records were deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'

  /progress:
    get:
      tags: [Progress]
      operationId: getProjectProgress
      summary: Progress of projects
      description: |
        "N of M tasks done" for each requested project (FR-18, BR-15, EC-05).
        Projects the caller cannot see, and unknown ids, are left out.
      parameters:
        - name: project_id
          in: query
          required: true
          description: One or more project ids (repeat the parameter), at most 100.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Progress per project.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectProgress'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: No `project_id`, more than 100, or an id that is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspaces:
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Create a workspace
      description: |
        Creates a workspace (FR-02, US-02, BR-01).

        **Who can perform it:** any signed-in account. No membership is
        needed. The account is always the one in the session.

        **Set by the server:** the caller becomes the first member of the
        new workspace, as a Workspace Administrator, in the same transaction
        (SP-07, R-02). The workspace is kept apart from all others (NFR-01).

        **Rules checked (422):** `name` is required and 3 to 100 characters
        after trimming spaces (same rule as project names) and contains no NUL
        character (U+0000), which the database cannot store; no other fields
        are sent (`workspace_id`, `role`, `account_id` and `member_id` cannot
        be sent). Names need not be unique. A name sent as a JSON number or
        boolean is accepted and stored as text.

        The response has no `Location` header (decided 2026-11-19). The only
        403 is `csrf_invalid`: no role is checked.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreateRequest'
            examples:
              newWorkspace:
                value:
                  name: Harbor Works
      responses:
        '201':
          description: The workspace was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedWorkspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            `name` missing, shorter than 3 or longer than 100 characters after
            trimming, containing a NUL character, or a field that cannot be sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                nameTooShort:
                  value:
                    code: validation_failed
                    message: The workspace could not be saved.
                    details:
                      - field: name
                        issue: The name must be 3 to 100 characters long.

  /workspaces/{workspace_id}/members:
    get:
      tags: [Workspaces]
      operationId: listWorkspaceMembers
      summary: Active members of a workspace
      description: |
        For choosing a project owner (FR-06). The task list also uses it for
        the owner filter and the create-task owner choice (the API refuses a
        task owner outside the project, 422). Any active member of the
        workspace.
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Active members, sorted by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The workspace does not exist or the caller is not a member of it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{project_id}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List a project's tasks
      description: |
        The tasks of one project with their owner, status and due date (US-12,
        FR-13), optionally filtered by status and owner (US-14, FR-15).
        Filtering by due date (FR-15) is left for later (decided 2026-11-12).
        Filters combine (AND), and paging applies to the filtered result.
        `status_counts` always counts every task of the project, whatever the
        filters, so it matches the project's progress (FR-18, BR-15).

        **Order:** earliest due date first, tasks without a due date last, then
        by title ignoring case, then by id (decided 2026-11-12).

        **Who can perform it:** any active member of the project's workspace,
        including Viewers and Workspace Administrators (FR-05, FR-13, AC-19.1).
        A project in another workspace gives 404 (API-A3).
      parameters:
        - name: status
          in: query
          required: false
          description: Only tasks with exactly this status.
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: owner_member_id
          in: query
          required: false
          description: Only tasks owned by this member.
          schema:
            $ref: '#/components/schemas/Id'
        - name: page
          in: query
          required: false
          description: Zero-based page number. A page whose first item would come after position 2147483647 (page times size above 2147483647) is refused with 422.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Number of tasks per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: One page of the project's tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
              examples:
                filteredByStatus:
                  summary: Tasks "In progress", first page
                  value:
                    items:
                      - task_id: tsk_001
                        project_id: prj_website
                        title: Draft homepage text
                        description: null
                        owner_member_id: mem_ben
                        owner_name: Ben Demo
                        due_date: '2026-11-04'
                        status: In progress
                        created_by_member_id: mem_ana
                    page: 0
                    size: 20
                    total: 1
                    status_counts:
                      - status: To do
                        count: 1
                      - status: In progress
                        count: 1
                      - status: Done
                        count: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '422':
          description: |
            `status` is not exactly one of `To do`, `In progress`, `Done`;
            `owner_member_id` is not a valid id; or `page` or `size` is outside
            its range or not a whole number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task in a project
      description: |
        Creates a task in the given project with a title, an optional description,
        exactly one owner, an optional due date and an optional status (US-10;
        FR-09, FR-10, FR-11, FR-12).

        **Who can perform it:** an active member of the project's workspace whose
        role is Project Manager or Team Member (FR-09, BR-12). Viewers and
        deactivated members are refused (FR-05, AC-19.2, SP-04).

        **Defaults and server-set fields:**
        - `status` is `To do` when it is not sent (FR-12, BR-11, AC-10.1);
          otherwise it must be exactly one of the three statuses (decided
          2026-11-12).
        - `created_by_member_id` is the signed-in member; it decides who may
          later delete the task (FR-09, BR-12).

        **Rules checked:**
        - `title` is required. Leading and trailing spaces are removed, and the
          result must be 3 to 150 characters long, so a title of spaces only is
          refused (BR-10, AC-10.2; PD-04 and PD-21 decided 2026-11-12).
        - `description`, when sent, is at most 2000 characters (decided 2026-11-12).
        - `owner_member_id` must be an active member of this project (FR-10, BR-09, AC-10.3).
          A Viewer who is a project member may be the owner (FR-10).
        - All referenced records belong to the project's workspace (NFR-01, BR-18).

        **Planned side effect, not built in this delivery:** a "task assigned"
        notification for the owner (FR-17, BR-14, US-16; PD-12 pending).

        **Provisional rules until decided (403):** Workspace Administrators are
        refused (PD-03); a Team Member may only set themselves as the owner
        (PD-01); the caller must be a member of the project (PD-20).

        **Pending:** behaviour in an archived project (PD-05).
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
            examples:
              createTaskForAna:
                summary: Task with an owner and a due date (AC-10.1)
                value:
                  title: Draft homepage text
                  description: First draft of the homepage copy for review.
                  owner_member_id: mem_ana
                  due_date: '2026-11-06'
              createTaskWithoutDueDate:
                summary: Task without a due date (EC-06, DA-04)
                value:
                  title: Collect logo files
                  owner_member_id: mem_ana
      responses:
        '201':
          description: |
            The task was created. Its status is `To do` unless another was sent
            (AC-10.1). It now appears in the project task list (FR-13).
            "My tasks" (FR-14) is not built in this delivery.
          headers:
            Location:
              description: |
                Path of the new task, `/projects/{project_id}/tasks/{task_id}`;
                read it with `getTask` (decided 2026-11-18).
              schema:
                type: string
              example: /projects/prj_website/tasks/tsk_001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                createdTask:
                  summary: Created task (AC-10.1)
                  value:
                    task_id: tsk_001
                    project_id: prj_website
                    title: Draft homepage text
                    description: First draft of the homepage copy for review.
                    owner_member_id: mem_ana
                    owner_name: Ana Demo
                    due_date: '2026-11-06'
                    status: To do
                    created_by_member_id: mem_carla
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '422':
          description: |
            The body is well formed but breaks a validation rule. Triggers:
            - `title` is missing, or shorter than 3 or longer than 150
              characters after trimming, including a title of spaces only
              (AC-10.2, BR-10).
            - `description` is longer than 2000 characters.
            - `status` is not exactly one of `To do`, `In progress`, `Done`
              (including `null`).
            - `owner_member_id` is missing (BR-09).
            - `owner_member_id` does not refer to an active member of this project,
              including a member of the workspace who is not in the project
              (AC-10.3, BR-09) or a member of another workspace (NFR-01).
            - `due_date` is not a valid calendar date.
            - An unknown field is sent, including `created_by_member_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                titleRequired:
                  summary: Empty title (AC-10.2)
                  value:
                    code: validation_failed
                    message: The task could not be created.
                    details:
                      - field: title
                        issue: A title is required.
                ownerNotProjectMember:
                  summary: Owner is not a member of the project (AC-10.3)
                  value:
                    code: validation_failed
                    message: The task could not be created.
                    details:
                      - field: owner_member_id
                        issue: The owner must be an active member of this project.

  /projects/{project_id}/tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Get a task of a project
      description: |
        Any active member of the project's workspace, including Viewers (FR-05,
        FR-13). A task that does not belong to `project_id` gives 404, even if
        the task exists in another project the caller can see, so a task can
        only be reached through its own project.
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: Edit a task
      description: |
        Changes the sent fields (US-25, AC-10.4, US-11). Fields not sent stay
        unchanged; `null` clears `description` or `due_date`. The same rules as
        `createTask` apply to each value. A body with no fields changes nothing;
        Viewers and Workspace Administrators get 403 even for an empty body.
        The task must belong to `project_id` (404 otherwise).

        **Who can change which field** (provisional until PD-01, PD-03 and
        PD-17 are decided; approved 2026-11-12):
        - `title`, `description`, `due_date`: any active Project Manager of the
          project's workspace, or the task's owner when the owner is a Team Member.
        - `owner_member_id`: Project Managers only (AC-10.4). The new owner
          must be an active member of the project (BR-09, AC-10.3).
        - `status`: the task's owner only (AC-11.1).
        - Viewers and Workspace Administrators cannot change tasks.

        Permissions are checked before values. If any sent field may not be
        changed by the caller, nothing is changed and the response is 403.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
            examples:
              newOwner:
                summary: Give the task to Carla (AC-10.4)
                value:
                  owner_member_id: mem_carla
              rename:
                summary: Change the title and clear the due date
                value:
                  title: Draft homepage text, second round
                  due_date: null
      responses:
        '200':
          description: The task after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '422':
          $ref: '#/components/responses/TaskValidationFailed'
    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: Delete a task
      description: |
        Deletes the task together with its comments and notifications in one
        transaction, so no dependent record remains (US-26, FR-09, DA-05). The
        task leaves the task list and the progress count (AC-17.3). Cannot be
        undone. The task must belong to `project_id` (404 otherwise).

        **Who can perform it:** the member who created the task (BR-12,
        AC-26.1, AC-26.2), unless they are now a Viewer or deactivated (FR-05,
        SP-04).
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: The task and its comments and notifications were deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'

  /projects/{project_id}/tasks/{task_id}/eligible-assignees:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: listEligibleAssignees
      summary: List the members who can be assigned to a task
      description: |
        The active members of the task's project, Viewers included, sorted by
        name (FR-07, FR-22, BR-22). Deactivated members are never eligible
        (SP-04). Members already assigned are included; `listTaskAssignees`
        tells them apart. Only the member id, name and role are returned.
        The task edit form uses this list for the owner choice (AC-10.3). The
        create form offers the workspace's active members
        (`listWorkspaceMembers`), because this list needs an existing task;
        owners outside the project are refused with 422.

        **Who can perform it:** any active member of the project's workspace.
      responses:
        '200':
          description: The eligible members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EligibleMember'
              examples:
                websiteMembers:
                  value:
                    - member_id: mem_ana
                      name: Ana Demo
                      role: Project Manager
                    - member_id: mem_ben
                      name: Ben Demo
                      role: Team Member
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'

  /projects/{project_id}/tasks/{task_id}/assignees:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: listTaskAssignees
      summary: List a task's assignees
      description: |
        The members assigned to the task in addition to its owner (FR-22,
        US-29), sorted by name. An assignee who was deactivated later is still
        listed (as for owners, EC-04).

        **Who can perform it:** any active member of the project's workspace,
        including Viewers (FR-05).
      responses:
        '200':
          description: The task's assignees; empty when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assignee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
    post:
      tags: [Tasks]
      operationId: assignTask
      summary: Assign one or more members to a task
      description: |
        Adds the given members as assignees (FR-22, US-29). Being assigned
        does not make a member the owner: the owner stays the only person
        whose "My tasks", notifications and status rights depend on the task
        (FR-10, FR-14, FR-17, AC-11.1; decided 2026-11-12).

        **Who can perform it:** any active Project Manager of the project's
        workspace (provisional until PD-01 is decided, approved 2026-11-12).
        Team Members, Viewers and Workspace Administrators get 403.

        **Rules, checked in this order; if any fails, nothing is saved:**
        1. `member_ids` has 1 to 20 entries (422).
        2. Every id is a valid id of an active member of the task's project
           (422, BR-22). A member of another workspace is never eligible.
        3. No id appears twice in the request, and none is already assigned
           (409 `conflict`). The database also refuses a second assignment of
           the same member to the same task (BR-22).
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRequest'
            examples:
              benAndVera:
                value:
                  member_ids: [mem_ben, mem_vera]
      responses:
        '201':
          description: The members were assigned. The full list of assignees is returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assignee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          description: A member is already assigned to the task, or appears twice in the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                alreadyAssigned:
                  value:
                    code: conflict
                    message: Ben Demo is already assigned to this task.
                    details:
                      - field: member_ids
                        issue: Ben Demo is already assigned to this task.
        '422':
          description: |
            `member_ids` is missing, empty or has more than 20 entries, or an
            id is not an active member of the task's project. An unknown field
            is also refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notEligible:
                  value:
                    code: validation_failed
                    message: The members could not be assigned.
                    details:
                      - field: member_ids
                        issue: Only active members of this project can be assigned.

  /projects/{project_id}/tasks/{task_id}/assignees/{member_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - name: member_id
        in: path
        required: true
        description: The assigned member (Member.member_id).
        schema:
          $ref: '#/components/schemas/Id'
    delete:
      tags: [Tasks]
      operationId: unassignTask
      summary: Remove one assignee from a task
      description: |
        Removes this one assignment; other assignees and the owner stay
        (US-29). **Who can perform it:** the same as `assignTask`.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: The assignment was removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The task was not found, or the member is not assigned to it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{project_id}/tasks/{task_id}/comments:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Comments]
      operationId: listTaskComments
      summary: List a task's comments
      description: |
        Every comment of the task, oldest first, then by id (DA-07; order
        decided 2026-11-12), with the author's name and the time it was posted.
        No pages. A task that does not belong to `project_id` gives 404.

        **Who can perform it:** any active member of the project's workspace,
        including Viewers (FR-05, FR-13).
      responses:
        '200':
          description: The comments; empty when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
    post:
      tags: [Comments]
      operationId: addTaskComment
      summary: Comment on a task
      description: |
        Adds a comment to the task (US-15, FR-16). Comments cannot be edited
        or deleted in the MVP.

        **Set by the server, never by the client:** the author is the
        signed-in member and `created_at` is the server's time. Sending
        `author_member_id`, `created_at` or any other field except `body` is
        refused with 422.

        **Rules:** `body` is required. Leading and trailing spaces are removed
        and the stored text must be 1 to 2000 characters, so a comment of only
        spaces is refused (BR-13, EC-08; limit decided 2026-11-12).

        **Who can perform it:** an active Project Manager or Team Member who is
        a member of the task's project (provisional rule approved 2026-11-12,
        as for task creation, PD-20). Viewers are refused (FR-05, PD-17), and
        Workspace Administrators (PD-03).

        **Not yet implemented:** the "comment added" notification to the task's
        owner (FR-17, BR-14, R-16), left for the notifications increment (CMP-08).
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
            examples:
              question:
                value:
                  body: Should the photos use the new colours?
      responses:
        '201':
          description: The comment was added and is returned with its author and date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
              examples:
                added:
                  value:
                    comment_id: cmt_001
                    task_id: tsk_001
                    author_member_id: mem_ben
                    author_name: Ben Demo
                    body: Should the photos use the new colours?
                    created_at: '2026-11-12T17:40:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '422':
          description: |
            `body` is missing, `null`, only spaces, or longer than 2000
            characters after trimming; or another field was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                empty:
                  value:
                    code: validation_failed
                    message: The comment could not be posted.
                    details:
                      - field: body
                        issue: A comment cannot be empty.

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: MATRIZ_SESSION
      description: |
        Server-side session created by `signIn` (TD-03, decided 2026-11-12).
        The cookie is HttpOnly and SameSite=Lax (and Secure when
        `MATRIZ_COOKIE_SECURE` is `true`). The session expires after 8 hours without requests
        (`MATRIZ_SESSION_TIMEOUT`), and ends at `signOut` or when the
        application restarts. Every operation except `getCsrfToken` and `signIn`
        requires it (FR-01, SP-01). Permissions are then checked by role
        (FR-04, SP-03, CMP-03 Access Control), and deactivated members are
        refused (SP-04). Requests that change data also need `X-XSRF-TOKEN`.

  parameters:
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: |
        The value of the `XSRF-TOKEN` cookie (set by `getCsrfToken` and renewed
        by `signIn`). Required on every request that changes data; without a
        valid value the response is 403 `csrf_invalid`.
      schema:
        type: string
    ProjectId:
      name: project_id
      in: path
      required: true
      description: |
        Identifier of the project (Project.project_id). The project must belong
        to the signed-in member's workspace (NFR-01).
      schema:
        $ref: '#/components/schemas/Id'
      example: prj_website
    TaskId:
      name: task_id
      in: path
      required: true
      description: |
        Identifier of the task (Task.task_id). The task must belong to the
        signed-in member's workspace (NFR-01).
      schema:
        $ref: '#/components/schemas/Id'
      example: tsk_001

  responses:
    BadRequest:
      description: The request body is missing or cannot be parsed as JSON (assumption API-A2).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            malformedBody:
              value:
                code: malformed_request
                message: The request body could not be read.
    Unauthorized:
      description: |
        No valid session. Workspace content is only available to signed-in
        members (FR-01, SP-01). `not_authenticated`: no session cookie was
        sent. `session_expired`: the session cookie belongs to a session that
        expired, was ended by sign-out, or was lost at a restart.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notSignedIn:
              value:
                code: not_authenticated
                message: Sign in to continue.
            sessionExpired:
              value:
                code: session_expired
                message: Your session has ended. Sign in again.
    CsrfInvalid:
      description: The request changes data but has no valid `X-XSRF-TOKEN` header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            csrfInvalid:
              value:
                code: csrf_invalid
                message: The request has no valid security token. Reload the page and try again.
    Forbidden:
      description: |
        The signed-in person may not perform this action, or the request has no
        valid `X-XSRF-TOKEN` header (`csrf_invalid`). Triggers:
        - the member's role is Viewer (FR-05, AC-11.3, AC-19.2);
        - the member is deactivated (FR-03, SP-04);
        - provisional rules for `createTask`: the member is a Workspace
          Administrator (PD-03), a Team Member setting another owner (PD-01),
          or not a member of the project (PD-20);
        - for `updateTask`, a sent field the member may not change (see that
          operation); for `deleteTask`, the member did not create the task (BR-12);
        - for `assignTask` and `unassignTask`, the member is not a Project
          Manager (provisional, PD-01);
        - for `addTaskComment`, the member is a Viewer or Workspace
          Administrator, or not a member of the task's project (provisional).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            viewerReadOnly:
              summary: Viewer tries to change data (AC-11.3, AC-19.2)
              value:
                code: forbidden
                message: Viewers have read-only access.
    ProjectNotFound:
      description: |
        No project with this identifier exists in the signed-in member's
        workspace. A project in another workspace gives the same response
        (NFR-01, SP-02, assumption API-A3).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            projectNotFound:
              value:
                code: not_found
                message: The project was not found.
    ProjectValidationFailed:
      description: |
        The body is well formed but breaks a validation rule: `workspace_id`
        missing or empty on create; `name` missing, shorter than 3 or longer than 100 characters after trimming;
        `description` longer than 1000 characters; `owner_member_id` not an
        active member of the project's workspace; `owner_member_id` sent as
        `null`; an invalid date; `start_date` after `due_date`; or a field
        that cannot be sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            nameTooShort:
              value:
                code: validation_failed
                message: The project could not be saved.
                details:
                  - field: name
                    issue: The name must be 3 to 100 characters long.
            ownerMissing:
              value:
                code: validation_failed
                message: The project could not be saved.
                details:
                  - field: owner_member_id
                    issue: An owner is required.
            datesOutOfOrder:
              value:
                code: validation_failed
                message: The project could not be saved.
                details:
                  - field: due_date
                    issue: The due date cannot be before the start date.
    TaskNotFound:
      description: |
        No task with this identifier exists in the signed-in member's workspace,
        including a task that was deleted (FR-09). A task in another workspace
        gives the same response (NFR-01, SP-02, assumption API-A3).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            taskNotFound:
              value:
                code: not_found
                message: The task was not found.
    TaskValidationFailed:
      description: |
        The body is well formed but breaks a validation rule: `title` shorter
        than 3 or longer than 150 characters after trimming (including spaces
        only or `null`); `description` longer than 2000 characters; `status`
        not exactly one of `To do`, `In progress`, `Done` (including `null`);
        `owner_member_id` `null` or not an active member of the task's project; an invalid date; or a
        field that cannot be sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            titleTooShort:
              value:
                code: validation_failed
                message: The task could not be saved.
                details:
                  - field: title
                    issue: The title must be 3 to 150 characters long.

  schemas:
    SignInRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          description: The account's email address (DA-01).
        password:
          type: string
          writeOnly: true
          description: Checked against the stored BCrypt hash; never stored, returned or logged.

    Profile:
      type: object
      description: The signed-in person. Never contains the password or its hash.
      required: [account_id, name, email, memberships]
      properties:
        account_id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        email:
          type: string
        memberships:
          type: array
          description: Active memberships only (SP-04).
          items:
            $ref: '#/components/schemas/Membership'
      examples:
        - account_id: a0000000-0000-0000-0000-000000000001
          name: Ana Demo
          email: ana@example.com
          memberships:
            - member_id: c0000000-0000-0000-0000-000000000002
              workspace_id: b0000000-0000-0000-0000-000000000001
              workspace_name: Acme Studio
              role: Project Manager

    Membership:
      type: object
      required: [member_id, workspace_id, workspace_name, role]
      properties:
        member_id:
          $ref: '#/components/schemas/Id'
        workspace_id:
          $ref: '#/components/schemas/Id'
        workspace_name:
          type: string
        role:
          type: string
          enum: [Workspace Administrator, Project Manager, Team Member, Viewer]

    WorkspaceCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: Required; 3 to 100 characters after trimming spaces; no NUL character (U+0000). A JSON number or boolean is accepted and stored as text.

    CreatedWorkspace:
      type: object
      required: [workspace_id, name, member_id, role]
      properties:
        workspace_id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        member_id:
          description: The caller's new membership.
          $ref: '#/components/schemas/Id'
        role:
          type: string
          enum: [Workspace Administrator]

    ProjectCreateRequest:
      type: object
      required: [workspace_id, name]
      additionalProperties: false
      properties:
        workspace_id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: Required; 3 to 100 characters after trimming spaces.
        description:
          type: [string, 'null']
          maxLength: 1000
        owner_member_id:
          description: Optional; the caller when absent. Must be an active member of the workspace. Cannot be null.
          type: string
        start_date:
          type: [string, 'null']
          format: date
        due_date:
          type: [string, 'null']
          format: date

    ProjectUpdateRequest:
      type: object
      additionalProperties: false
      description: Only the fields sent are changed; `null` clears an optional field. `name` and `owner_member_id` cannot be null.
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 1000
        owner_member_id:
          type: string
        start_date:
          type: [string, 'null']
          format: date
        due_date:
          type: [string, 'null']
          format: date

    ProjectSummary:
      type: object
      required: [project_id, workspace_id, workspace_name, name, owner_member_id, is_archived]
      properties:
        project_id:
          $ref: '#/components/schemas/Id'
        workspace_id:
          $ref: '#/components/schemas/Id'
        workspace_name:
          type: string
        name:
          type: string
        owner_member_id:
          type: string
          description: Every project has an owner (decided 2026-11-12; migration V4).
        owner_name:
          type: string
        start_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        is_archived:
          type: boolean

    Project:
      allOf:
        - $ref: '#/components/schemas/ProjectSummary'
        - type: object
          properties:
            description:
              type: string

    ProjectPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          description: Number of matching projects across all pages.

    ProjectProgress:
      type: object
      required: [project_id, done, total]
      properties:
        project_id:
          $ref: '#/components/schemas/Id'
        done:
          type: integer
          description: Tasks with status Done.
        total:
          type: integer
          description: All tasks of the project; "0 of 0 tasks done" when it has none (EC-05).

    WorkspaceMember:
      type: object
      required: [member_id, name, role]
      properties:
        member_id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        role:
          type: string
          enum: [Workspace Administrator, Project Manager, Team Member, Viewer]

    Id:
      type: string
      minLength: 1
      description: Opaque identifier (database.md type `id`). Its format is not decided (assumption API-A4).

    TaskStatus:
      type: string
      enum: [To do, In progress, Done]
      description: A task's status; exactly one of three values (FR-12, BR-11, AC-11.2).

    TaskCreateRequest:
      type: object
      description: Fields a client may send to create a task (FR-09, FR-10, FR-11).
      required: [title, owner_member_id]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
          description: |
            Required (FR-09, BR-10, AC-10.2). Leading and trailing spaces are
            removed; the lengths apply to the trimmed value, so a title of
            spaces only is refused (decided 2026-11-12).
          examples: [Draft homepage text]
        description:
          type: [string, 'null']
          maxLength: 2000
          description: |
            Optional (DA-04); at most 2000 characters (decided 2026-11-12).
            `null` or an empty string means none.
          examples: [First draft of the homepage copy for review.]
        owner_member_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: |
            The task's single owner (Member.member_id). Must be a member of the
            task's project (FR-10, BR-09, AC-10.3). Whether a Team Member may set
            someone other than themselves is pending PD-01.
          examples: [mem_ana]
        due_date:
          type: [string, 'null']
          format: date
          description: |
            Optional due date (FR-11; DA-04; pending PD-04). A task without a due
            date is never overdue (EC-06, BR-16). `null` means none.
          examples: ['2026-11-06']
        status:
          allOf:
            - $ref: '#/components/schemas/TaskStatus'
          description: Optional; `To do` when not sent (BR-11, decided 2026-11-12).

    TaskUpdateRequest:
      type: object
      description: |
        Fields that `updateTask` can change; each is optional. Who may change
        which field is described in `updateTask`.
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
          description: Same rule as in `TaskCreateRequest`; cannot be `null`.
        description:
          type: ['string', 'null']
          maxLength: 2000
          description: '`null` or an empty string clears it.'
        owner_member_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: A member of the task's project (BR-09, AC-10.4); cannot be `null`.
        due_date:
          type: ['string', 'null']
          format: date
          description: '`null` clears it.'
        status:
          $ref: '#/components/schemas/TaskStatus'

    TaskPage:
      type: object
      required: [items, page, size, total, status_counts]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          description: Number of tasks matching the filters across all pages.
        status_counts:
          type: array
          description: |
            Number of the project's tasks per status, always the three statuses
            in the order `To do`, `In progress`, `Done`, ignoring the filters.
          items:
            type: object
            required: [status, count]
            properties:
              status:
                $ref: '#/components/schemas/TaskStatus'
              count:
                type: integer
                minimum: 0

    EligibleMember:
      type: object
      description: A member who can be assigned to a task. No email or other account data.
      required: [member_id, name, role]
      properties:
        member_id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          description: Personal data (database.md, Account.name).
        role:
          type: string
          enum: [Workspace Administrator, Project Manager, Team Member, Viewer]

    Assignee:
      type: object
      description: A member assigned to a task (TaskAssignee). No email or other account data.
      required: [member_id, name, assigned_at]
      properties:
        member_id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          description: Personal data (database.md, Account.name).
        assigned_at:
          type: string
          format: date-time
          description: When the member was assigned, set by the server.

    AssignRequest:
      type: object
      required: [member_ids]
      additionalProperties: false
      properties:
        member_ids:
          type: array
          minItems: 1
          maxItems: 20
          description: An id sent twice gives 409 `conflict`, not 422.
          items:
            $ref: '#/components/schemas/Id'

    CommentCreateRequest:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: Trimmed by the server; 1 to 2000 characters after trimming, not only spaces.

    Comment:
      type: object
      description: A comment on a task (database.md, Comment). No email or other account data of the author.
      required: [comment_id, task_id, author_member_id, author_name, body, created_at]
      properties:
        comment_id:
          $ref: '#/components/schemas/Id'
        task_id:
          $ref: '#/components/schemas/Id'
        author_member_id:
          $ref: '#/components/schemas/Id'
        author_name:
          type: string
          description: Personal data (database.md, Account.name).
        body:
          type: string
          description: May contain personal data entered by users (database.md).
        created_at:
          type: string
          format: date-time
          description: When the comment was posted, set by the server.

    Task:
      type: object
      description: |
        A task, as defined by the Task entity in docs/database.md. Overdue state
        and project progress are derived and not part of the task (BR-15, BR-16).
      required:
        - task_id
        - project_id
        - title
        - owner_member_id
        - status
        - created_by_member_id
      properties:
        task_id:
          $ref: '#/components/schemas/Id'
        project_id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
          minLength: 3
          maxLength: 150
        description:
          type: ['string', 'null']
          description: Null or absent when not given (DA-04).
        owner_member_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The task's single owner (FR-10, BR-09, AC-10.4).
        owner_name:
          type: ['string', 'null']
          description: |
            The owner's name, for display (FR-13). Read only. Personal data
            (database.md, Account.name).
        due_date:
          type: ['string', 'null']
          format: date
          description: Null or absent when the task has no due date (EC-06, DA-04).
        status:
          $ref: '#/components/schemas/TaskStatus'
        created_by_member_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The member who created the task; decides who may delete it (FR-09, BR-12).

    Error:
      type: object
      description: Error body for every error response this contract defines.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          enum: [malformed_request, not_authenticated, session_expired, invalid_credentials, forbidden,
                 csrf_invalid, not_found, validation_failed, conflict]
        message:
          type: string
          description: Human-readable summary in the interface language (NFR-09, pending PD-13).
        details:
          type: array
          description: One entry per field that failed validation (422), or the conflicting field (409).
          items:
            type: object
            required: [field, issue]
            properties:
              field:
                type: string
                description: Name of the request field concerned.
              issue:
                type: string
                description: What is wrong with the field.
